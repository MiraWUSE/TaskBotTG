services:
  bot:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/bot.sqlite3
    volumes:
      - bot_data:/app/data
    restart: unless-stopped
    init: true
    stop_grace_period: 90s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  bot_data:
